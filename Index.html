<style>
/* Layout: ramo 3D a la izquierda (fijo al hacer scroll) y cuatro pasos de selección a la derecha; en celular el ramo queda arriba fijo */
:root{
  --bg:#fbf6f9; --fg:#2a1f2d; --muted:#6f5d73; --surface:#ffffff; --line:#e6d8e2;
  --accent:#b02262; --accent-fg:#ffffff; --leaf:#2f6b4f; --tile:#f1e2ec; --petal-edge:rgba(42,31,45,.2);

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16111a; --fg:#f3e9f1; --muted:#b7a5b9; --surface:#1f1825; --line:#3a2d42;
    --accent:#f07aa8; --accent-fg:#2a0f1c; --leaf:#7cc4a0; --tile:#2a2030; --petal-edge:rgba(255,255,255,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16111a; --fg:#f3e9f1; --muted:#b7a5b9; --surface:#1f1825; --line:#3a2d42;
  --accent:#f07aa8; --accent-fg:#2a0f1c; --leaf:#7cc4a0; --tile:#2a2030; --petal-edge:rgba(255,255,255,.25);
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1040px;margin:0 auto}
header{display:grid;gap:6px;margin-bottom:12px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:600}
h1{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}

.app{display:grid;gap:20px}
.preview{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.stage{position:relative;height:min(40vh,380px);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 30%,var(--surface),var(--tile) 75%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hint3d{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.nogl{margin:0;padding:24px;color:var(--muted);text-align:center}
.controls{display:grid;gap:26px;min-width:0}
section h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px;letter-spacing:-.01em}
section .hint{margin:0 0 10px;font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{font:inherit;text-align:left;display:grid;gap:2px;padding:10px 12px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--tile)}
.opt b{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}

.sw.mix{background:conic-gradient(#c8102e,#f28a2e,#f2c230,#fbf8f4,#a88bd6,#ef7fa6,#c8102e)}
.qty{display:grid;gap:10px}
.qty-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qty-num{font-family:var(--font-display);font-size:2.6rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.qty-lbl{color:var(--muted);font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.decor{display:grid;gap:8px}
.dec{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:10px}
.dec label.main{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;min-height:28px}
.dec input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sub{display:grid;gap:8px;padding-left:30px}
.sub .chips .chip{font-size:13px;padding:6px 12px;min-height:34px}

.sum h2{margin:0}

.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:44px;justify-self:start}
.btn:hover{filter:brightness(1.07)}
.ok{font-size:13px;color:var(--leaf);min-height:1.2em}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.res{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));animation:resin .35s ease both}
.res-in{max-width:640px;margin:0 auto;display:grid;gap:16px;justify-items:center;text-align:center}
.res-in .res-back{justify-self:start}
.res h2{font-family:var(--font-display);font-size:clamp(3rem,15vw,5.2rem);margin:0;line-height:.95;letter-spacing:-.03em;color:var(--accent);text-wrap:balance}
.res-para{margin:0;font-size:1.1rem;color:var(--accent);font-weight:600}
.res-fig{width:100%;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,var(--surface),var(--tile) 80%);padding:8px}
.res-fig img{display:block;margin:0 auto;max-height:52vh;width:auto;object-fit:contain}
.res-hero{margin:4px 0;font-family:var(--font-display);font-size:clamp(1.3rem,4.4vw,1.8rem);line-height:1.3;color:var(--accent);text-wrap:balance}
.res-sum{margin:0;white-space:pre-line;font-size:14px;color:var(--muted)}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.res-list li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.45;animation:resup .5s ease both}
.res-list li::before{content:"✿";display:block;color:var(--accent);font-size:15px;margin-bottom:2px}
.res-list li.msg{border-color:var(--accent);background:var(--tile)}
.res-firma{margin:6px 0 2px;font-family:var(--font-display);font-size:1.4rem;color:var(--accent)}
@keyframes resin{from{opacity:0}to{opacity:1}}
@keyframes resup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.res,.res-list li{animation:none}}
@media (min-width:860px){
  .app{grid-template-columns:minmax(340px,480px) 1fr;align-items:start;gap:32px}
  .preview{top:16px}
  .stage{height:min(78vh,640px)}
}
</style>

<script>
var TIPOS=[
 {id:"clasica",n:"Clásica",d:"Botón alto y pétalos en espiral, la más tradicional.",s:"clásica",p:"clásicas"},

];

 {id:"mixto",n:"Mixto",h:null,m:"Todos los colores",s:"de colores mezclados",p:"de colores mezclados"}
];
var PAPELES=[{id:"kraft",n:"Kraft",a:"#b98a5a",b:"#d9ae7c"},{id:"negro",n:"Negro",a:"#25202d",b:"#463f52"},{id:"blanco",n:"Blanco",a:"#e9e2da",b:"#fbf8f4"}];
var LAZOS=[{id:"vino",n:"Vino",h:"#8a1536"},{id:"dorado",n:"Dorado",h:"#c9a13b"},{id:"blanco",n:"Blanco",h:"#f7f3ee"},{id:"negro",n:"Negro",h:"#25212a"}];
var DECOR=[
 {id:"eucalipto",n:"Eucalipto"},
 {id:"gypso",n:"Flor de nube (gypsophila)"},
 {id:"lazo",n:"Lazo de satén"},
 {id:"papel",n:"Papel de envoltura"},
 {id:"mariposas",n:"Mariposas de papel"}
];
var PRESETS=[[1,"1"],[3,"3"],[6,"Media docena"],[12,"Docena"],[24,"2 docenas"],[50,"50"]];
var st={tipo:"clasica",color:"rojo",cant:12,decor:{eucalipto:false,gypso:false,lazo:true,papel:true,mariposas:false,tarjeta:false},papel:"kraft",lazo:"vino",para:"",msg:""};

function $(id){return document.getElementById(id);}
function find(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return arr[0];}
function toRgb(h){var n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function toHex(a){return "#"+a.map(function(v){return ("0"+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);}).join("");}
function mix(h1,h2,t){var a=toRgb(h1),b=toRgb(h2);return toHex([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}

/* ---------- 3D ---------- */
var GL={ok:false,wings:[],card:null,cardTex:null,cardCv:null,camDist:8,camTarget:8,zoom:1,lastTouch:0,drag:null,cache:{},mats:{}};
var WHITE=null,TMPC=null;

function falla(){
  var h=$("stage");
  var c=h.querySelector("canvas");if(c)c.remove();
  var p=document.createElement("p");p.className="nogl";
  p.textContent="Tu navegador no pudo mostrar el ramo en 3D. Puedes seguir armando el pedido abajo.";
  h.appendChild(p);
}

function addPetal(acc,M,o,tint,t){
  var NU=12,NV=12,base=acc.p.length/3,dv=1/NV,prof=[[o.rho0,o.y0]],rho=o.rho0,y=o.y0,j,i;
  for(j=1;j<=NV;j++){
    var thm=o.th0+o.k*(j-.5)*dv;
    rho+=Math.sin(thm)*o.L*dv;y+=Math.cos(thm)*o.L*dv;
    prof.push([rho,y]);
  }
  var cBase=tint.clone().multiplyScalar(.36+.3*t),cTip=tint.clone().lerp(WHITE,.17),shadeIn=.7+.3*t;
  var v3=new THREE.Vector3();
  for(j=0;j<=NV;j++){
    var v=j/NV;
    var hw=o.W*(.5+.5*Math.sin(Math.PI*Math.min(1,v*.85+.1)))*Math.sqrt(Math.max(1e-4,1-Math.pow(v,5)));
    var rc=Math.max(.004,prof[j][0]);
    for(i=0;i<=NU;i++){
      var u=-1+2*i/NU,side=u*hw;
      var dpsi=Math.max(-1.25,Math.min(1.25,side/Math.max(rc,.07)));
      var psi=o.psi+dpsi;
      var rr=rc+o.flare*u*u*v+.035*Math.pow(Math.abs(u),3)*sstep(.55,1,v);
      var yy=prof[j][1]+o.ruffle*Math.sin(u*Math.PI*2.2+o.ph)*v*v*Math.abs(u)+.012*Math.sin(u*5+o.ph*1.7+v*4)*v;
      v3.set(rr*Math.cos(psi),yy,rr*Math.sin(psi)).applyMatrix4(M);
      acc.p.push(v3.x,v3.y,v3.z);
      TMPC.copy(cBase).lerp(tint,sstep(0,.45,v)).lerp(cTip,sstep(.5,1,v)).multiplyScalar(shadeIn*(1-.14*Math.pow(Math.abs(u),3)));
      TMPC.lerp(WHITE,sstep(.72,1,Math.abs(u))*sstep(.35,1,v)*.1).multiplyScalar(.97+.06*Math.sin(u*9+o.ph));
      acc.c.push(TMPC.r,TMPC.g,TMPC.b);
    }
  }
  for(j=0;j<NV;j++)for(i=0;i<NU;i++){
    var a=base+j*(NU+1)+i,b=a+1,c=a+NU+1,d=c+1;
    acc.i.push(a,c,b,b,c,d);
  }
}
function headInto(acc,M,tipo,tint,rnd,N){
  var ing=tipo==="inglesa";
  N=N||(ing?44:26);
  var i;
  for(i=0;i<N;i++){
    var t=i/(N-1),tt=Math.pow(t,.85);
    addPetal(acc,M,{
      psi:i*2.39996+(rnd()-.5)*.14,
      rho0:lerp(.02,ing?.26:.2,t),
      y0:lerp(.1,ing?-.12:-.08,t),
      th0:lerp(-.18,ing?.75:.55,tt),
      k:lerp(.05,ing?1.45:1.05,t),
      L:lerp(.3,ing?.46:.44,t)*(.94+rnd()*.12),
      W:lerp(.12,ing?.27:.22,t)*(.94+rnd()*.12),
      flare:lerp(0,ing?.1:.05,t),
      ruffle:ing?.045*t:.02*t,
      ph:rnd()*6.28
    },tint,t);
  }
  var green=new THREE.Color("#3f7d4b");
  for(i=0;i<5;i++){
    addPetal(acc,M,{psi:i*1.2566+rnd()*.2,rho0:.05,y0:-.05,th0:2.35,k:-.55,L:.26,W:.06,flare:0,ruffle:0,ph:0},green,.6);
  }
}
function roseGeo(tipo,hex,seed){
  var rnd=rng(seed),acc={p:[],c:[],i:[]};
  if(tipo==="preservada")hex=mix(hex,"#b3a496",.28);
  var tint=new THREE.Color(hex);
  if(tipo==="spray"){
    var offs=[[-.4,.02,.12,.28,.1],[.42,-.04,.04,-.3,-.1],[.02,.1,-.42,.05,-.35]];
    for(var q=0;q<3;q++){
      var o=offs[q];
      var M=new THREE.Matrix4().compose(new THREE.Vector3(o[0],o[1],o[2]),new THREE.Quaternion().setFromEuler(new THREE.Euler(o[4],0,o[3])),new THREE.Vector3(.56,.56,.56));
      headInto(acc,M,"clasica",tint,rnd,14);
    }
  }else headInto(acc,new THREE.Matrix4(),tipo,tint,rnd);
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(acc.p,3));
  g.setAttribute("color",new THREE.Float32BufferAttribute(acc.c,3));
  g.setIndex(acc.i);
  g.computeVertexNormals();
  g.userData.keep=true;
  return g;
}
function addGeo(acc,geo,M,color){
  geo.applyMatrix4(M);
  var p=geo.attributes.position,idx=geo.index?geo.index.array:null,base=acc.p.length/3,i;
  for(i=0;i<p.count;i++){acc.p.push(p.getX(i),p.getY(i),p.getZ(i));acc.c.push(color.r,color.g,color.b);}
  if(idx)for(i=0;i<idx.length;i++)acc.i.push(idx[i]+base);
  else for(i=0;i<p.count;i++)acc.i.push(base+i);
  geo.dispose();
}
function cerrarGeo(acc){
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(acc.p,3));
  g.setAttribute("color",new THREE.Float32BufferAttribute(acc.c,3));
  g.setIndex(acc.i);
  g.computeVertexNormals();
  g.userData.keep=true;
  return g;
}
function loft(acc,NU,NV,pos,col){
  var base=acc.p.length/3,i,j,P,Cc;
  for(j=0;j<=NV;j++)for(i=0;i<=NU;i++){
    var u=-1+2*i/NU,v=j/NV;
    P=pos(u,v);Cc=col(u,v);
    acc.p.push(P[0],P[1],P[2]);acc.c.push(Cc.r,Cc.g,Cc.b);
  }
  for(j=0;j<NV;j++)for(i=0;i<NU;i++){
    var a=base+j*(NU+1)+i,b=a+1,c=a+NU+1,d=c+1;
    acc.i.push(a,c,b,b,c,d);
  }
}
function sunGeo(seed){

    var tt=now/1000,i;

    if(GL.card&&!calmo)GL.card.rotation.z=.07*Math.sin(tt*1.6);
    r.render(GL.scene,GL.camera);
  })(last);
}

var pendiente=null;
function programar(){
  if(!GL.ok)return;
  clearTimeout(pendiente);
  pendiente=setTimeout(construir3D,45);
}

/* ---------- Pedido y controles ---------- */
function textoPedido(){
  var n=st.cant,t=find(TIPOS,st.tipo),c=find(COLORES,st.color),d=st.decor,l=[];
  var cm=function(x){return /^(naranja|lila|de )/.test(x)?x:x.replace(/as$/,"os").replace(/a$/,"o");};
  if(t.id==="girasol")l.push(n===1?"1 girasol":n+" girasoles");
  else if(t.id==="tulipan")l.push(n===1?"1 tulipán "+cm(c.s):n+" tulipanes "+cm(c.p));
  else l.push(n===1?"1 rosa "+t.s+" "+c.s:n+" rosas "+t.p+" "+c.p);
  var ds=[];
  if(d.eucalipto)ds.push("eucalipto");
  if(d.gypso)ds.push("flor de nube");
  if(d.lazo)ds.push("lazo de satén "+find(LAZOS,st.lazo).n.toLowerCase());
  if(d.papel)ds.push("papel "+find(PAPELES,st.papel).n.toLowerCase());
  if(d.mariposas)ds.push("mariposas de papel");
  l.push("Decoración: "+(ds.length?ds.join(", "):"sin decoración"));
  if(d.tarjeta){
    var p=st.para.trim(),m=st.msg.trim();
    l.push("Tarjeta"+(p?" para "+p:"")+(m?": «"+m+"»":""));
  }
  l.push(dedic());
  return l.join("\n");
}
function etiquetaCant(n){
  var m={1:"una flor",6:"media docena",12:"una docena",24:"dos docenas",36:"tres docenas",48:"cuatro docenas"};
  return m[n]||(n+" flores");
}
function pintarBotones(){
  var b=document.querySelectorAll("[data-g]"),i;
  for(i=0;i<b.length;i++){
    var g=b[i].getAttribute("data-g"),v=b[i].getAttribute("data-v"),on=false;
    if(g==="tipo")on=st.tipo===v;
    else if(g==="color")on=st.color===v;
    else if(g==="papel")on=st.papel===v;
    else if(g==="lazo")on=st.lazo===v;
    else if(g==="cant")on=String(st.cant)===v;
    b[i].setAttribute("aria-pressed",on?"true":"false");
  }
  $("sub-papel").hidden=!st.decor.papel;
  $("sec-color").hidden=st.tipo==="girasol";
  $("sub-lazo").hidden=!st.decor.lazo;
}
function actualizar(){
  $("qnum").textContent=st.cant;
  $("qlbl").textContent=etiquetaCant(st.cant);
  $("qrange").value=st.cant;
  $("sumtxt").textContent=textoPedido();
  $("ok").textContent="";
  pintarBotones();
  programar();
}
function construir(){
  $("tipos").innerHTML=TIPOS.map(function(t){return '<button type="button" class="opt" data-g="tipo" data-v="'+t.id+'" aria-pressed="false"><b>'+t.n+'</b><small>'+t.d+'</small></button>';}).join("");
  $("colores").innerHTML=COLORES.map(function(c){
    var sw=c.h?'<span class="sw" style="background:'+c.h+'"></span>':'<span class="sw mix"></span>';
    return '<button type="button" class="opt" data-g="color" data-v="'+c.id+'" aria-pressed="false"><b>'+sw+c.n+'</b><small>'+c.m+'</small></button>';
  }).join("");
  $("qchips").innerHTML=PRESETS.map(function(p){return '<button type="button" class="chip" data-g="cant" data-v="'+p[0]+'" aria-pressed="false">'+p[1]+'</button>';}).join("");
  var sub={
    papel:'<div class="sub" id="sub-papel"><div class="chips">'+PAPELES.map(function(p){return '<button type="button" class="chip" data-g="papel" data-v="'+p.id+'" aria-pressed="false">'+p.n+'</button>';}).join("")+'</div></div>',
    lazo:'<div class="sub" id="sub-lazo"><div class="chips">'+LAZOS.map(function(p){return '<button type="button" class="chip" data-g="lazo" data-v="'+p.id+'" aria-pressed="false">'+p.n+'</button>';}).join("")+'</div></div>',
    tarjeta:'<div class="sub" id="sub-tarjeta"><label class="field" for="para">Para quién<input id="para" type="text" maxlength="18" placeholder="Nombre"></label><label class="field" for="msg">Mensaje<textarea id="msg" maxlength="120" placeholder="Escribe unas palabras"></textarea></label></div>'
  };
  $("decor").innerHTML=DECOR.map(function(x){
    return '<div class="dec"><label class="main"><input type="checkbox" data-d="'+x.id+'">'+x.n+'</label>'+(sub[x.id]||"")+'</div>';
  }).join("");
  var cbs=document.querySelectorAll("[data-d]");
  for(var i=0;i<cbs.length;i++)cbs[i].checked=!!st.decor[cbs[i].getAttribute("data-d")];
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-g]");
  if(!b)return;
  var g=b.getAttribute("data-g"),v=b.getAttribute("data-v");
  if(g==="cant")st.cant=parseInt(v,10);else st[g]=v;
  actualizar();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute("data-d")){st.decor[t.getAttribute("data-d")]=t.checked;actualizar();}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="qrange"){st.cant=parseInt(t.value,10);actualizar();}
  else if(t.id==="para"){st.para=t.value;$("sumtxt").textContent=textoPedido();dibujarCard();}
  else if(t.id==="msg"){st.msg=t.value;$("sumtxt").textContent=textoPedido();dibujarCard();}
});

/* ---------- Crear: ramo + frases bonitas ---------- */
var FR={
 final:"En diciembre te vuelvo a conquistar, ya lo verás.",

 gen:["Hay flores que no se marchitan nunca: las que se regalan con el corazón.","Este ramo no trae solo rosas; trae todo lo que a veces no se sabe decir.","Que cada pétalo te recuerde lo mucho que vales.","Las rosas hablan el idioma que las palabras no alcanzan.","Un ramo así es un abrazo que huele a primavera.","Hoy florece una sonrisa nueva.","Regalar flores es sembrar alegría en el día de alguien.","Hay personas que hacen más bonito el mundo; este ramo es para una de ellas.","Cada rosa es una razón más para sonreír.","Que nunca te falten flores, ni motivos para recibirlas.","Un detalle pequeño puede cambiarle el día a alguien.","Contigo, hasta lo cotidiano se vuelve poesía.","Quien regala rosas siempre se queda con el perfume en las manos.","Gracias por existir, por estar y por hacerlo todo más bonito.","Estas flores duran unos días; lo que siento, mucho más.","Mereces un jardín entero, pero por ahora te regalo este ramo."],
 col:{
  rojo:["El rojo es el idioma del amor: sin traducción y sin ruido.","Contigo, el corazón late en rojo.","Te quiero como florece una rosa roja: con fuerza y sin pedir permiso.","Un amor así no se explica, se regala."],
  rosado:["El rosa es la ternura hecha flor.","Gracias por tu cariño, que siempre llega suave y a tiempo.","Hay personas que son como el rosa del amanecer: calman el día.","Dulzura, gratitud y un poquito de magia."],

  amarillo:["Amarillo de sol, de risas y de amigos de verdad.","Para ti, que iluminas cualquier lugar al que llegas.","La amistad también merece flores.","Estas rosas traen alegría en cada pétalo."],
  naranja:["El naranja es entusiasmo puro: ganas de vivir y de celebrar.","Para quien convierte cada día en una aventura.","Energía, calidez y buenas noticias en forma de ramo.","Que nunca se apague tu brillo."],
  lila:["El lila es magia: de esas cosas que fascinan sin explicación.","Para quien me encanta desde el primer día.","Hay amores que parecen de cuento; este lila lo confirma.","Misterio, encanto y un poquito de ensueño."],
  mixto:["Un ramo con todos los colores, como todo lo que siento.","Cada color dice algo distinto, y todos dicen gracias.","Porque no hay un solo color que alcance para describirte.","Un jardín entero de alegría en un solo ramo."]
 },
 tipo:{

 }

var semilla=1,ultimas=[];
function mezclar(arr,rnd){
  var a=arr.slice(),i,j,t;
  for(i=a.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fraseCant(n){
  var m={1:"Una sola rosa, y aun así lo es todo: eres única.",2:"Dos rosas, dos corazones, una misma historia.",3:"Tres rosas para decir lo más importante: te quiero.",6:"Media docena de razones para sonreír.",12:"Una docena de rosas: doce meses, doce motivos, un solo cariño.",24:"Dos docenas, porque pienso en ti todo el día.",50:"Cincuenta rosas: un jardín completo en tus manos."};
  if(m[n])return m[n];
  if(n>=30)return "Tantas rosas, porque lo que siento no cabe en un ramo pequeño.";
  return n+" rosas, y ninguna alcanza para decir cuánto vale tu presencia.";
}
function frases(){
  var rnd=rng(semilla*7919+st.cant*31+st.color.length*101),d=st.decor,col=mezclar(FR.col[st.color],rnd),out=[],i;
  var amor=mezclar(FR.mias,rnd),hero=amor[0];
  for(i=1;i<amor.length;i++)out.push(amor[i]);
  out.push(FR.final);
  return {hero:hero,lista:out};
}
function foto(){
  if(!GL.ok)return "";
  try{GL.renderer.render(GL.scene,GL.camera);return GL.renderer.domElement.toDataURL("image/png");}catch(e){return "";}
}
function pintarRes(){
  var f=frases(),ul=$("rlist"),i,li;
  ultimas=[f.hero].concat(f.lista);
  $("rhero").textContent="«"+f.hero+"»";
  ul.innerHTML="";
  var d=st.decor,m=st.msg.trim();
  if(d.tarjeta&&m){li=document.createElement("li");li.className="msg";li.textContent="«"+m+"»";ul.appendChild(li);ultimas.push(m);}
  for(i=0;i<f.lista.length;i++){
    li=document.createElement("li");li.textContent=f.lista[i];li.style.animationDelay=(i*70)+"ms";ul.appendChild(li);
  }
}
function dedic(){
  return "De Juan para Mafe";
}
function abrirRes(){
  var src=foto(),p=st.para.trim();
  semilla=1;
  if(src){$("rimg").src=src;$("rfig").hidden=false;}else $("rfig").hidden=true;
  $("rsum").textContent=textoPedido();
  $("rfirma").textContent="Con cariño ♥";
  pintarRes();
  $("res").hidden=false;$("res").scrollTop=0;
  document.body.style.overflow="hidden";
  $("rcerrar").focus();
}
function cerrarRes(){
  $("res").hidden=true;document.body.style.overflow="";$("crear").focus();
}
$("crear").addEventListener("click",abrirRes);
$("rcerrar").addEventListener("click",cerrarRes);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("res").hidden)cerrarRes();});

construir();
initGL();
$("qlbl").textContent=etiquetaCant(st.cant);
$("sumtxt").textContent=textoPedido();
pintarBotones();
if(GL.ok)construir3D();
